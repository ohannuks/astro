[project]
name = "astro"
version = "0.1.0"
description = "Module for general astrophysics calculations developed during phys4430 course lecturing."
readme = "README.md"
authors = [
    { name = "Otto Akseli Hannuksela", email = "otto.akseli.hannuksela@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jax>=0.11.2",
]

[project.scripts]
astro = "astro:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
