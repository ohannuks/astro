[project]
name = "astro"
version = "0.1.0"
description = "Module for general astrophysics calculations developed during phys4430 course lecturing."
readme = "README.md"
authors = [
    { name = "Otto Akseli Hannuksela", email = "otto.akseli.hannuksela@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "jax>=0.11.2",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.2",
    "tensorflow-probability>=0.25.0",
]

[project.scripts]
astro = "astro:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
